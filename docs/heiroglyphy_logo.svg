<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 270" width="800" height="270">
  <defs>
    <!-- Glow filters -->
    <filter id="goldGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="tealGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="subtleGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Gradient for alignment lines -->
    <linearGradient id="alignGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f5c518" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#c4b5fd" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#3ec9a7" stop-opacity="0.7"/>
    </linearGradient>

    <!-- Radial glow for point clouds -->
    <radialGradient id="goldCloudGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f5c518" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#f5c518" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="tealCloudGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3ec9a7" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#3ec9a7" stop-opacity="0"/>
    </radialGradient>

    <!-- Clip for overlap region -->
    <clipPath id="overlapClip">
      <rect x="300" y="20" width="200" height="180"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="800" height="270" fill="#0f0f1a" rx="8"/>

  <!-- Subtle grid lines for mathematical feel -->
  <g opacity="0.04" stroke="#c4b5fd" stroke-width="0.5">
    <line x1="0" y1="50" x2="800" y2="50"/>
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="150" x2="800" y2="150"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="100" y1="0" x2="100" y2="270"/>
    <line x1="200" y1="0" x2="200" y2="270"/>
    <line x1="300" y1="0" x2="300" y2="270"/>
    <line x1="400" y1="0" x2="400" y2="270"/>
    <line x1="500" y1="0" x2="500" y2="270"/>
    <line x1="600" y1="0" x2="600" y2="270"/>
    <line x1="700" y1="0" x2="700" y2="270"/>
  </g>

  <!-- === GOLD POINT CLOUD (Egyptian / Left) === -->
  <!-- Ambient glow -->
  <ellipse cx="280" cy="110" rx="140" ry="100" fill="url(#goldCloudGlow)"/>

  <!-- Gold dots - scattered cluster (pre-alignment positions) -->
  <g filter="url(#goldGlow)">
    <circle cx="210" cy="60" r="3" fill="#f5c518" opacity="0.9"/>
    <circle cx="240" cy="45" r="2.5" fill="#f5c518" opacity="0.8"/>
    <circle cx="270" cy="55" r="3.5" fill="#f5c518" opacity="0.85"/>
    <circle cx="195" cy="85" r="2" fill="#f5c518" opacity="0.7"/>
    <circle cx="230" cy="78" r="3" fill="#f5c518" opacity="0.9"/>
    <circle cx="260" cy="72" r="2.5" fill="#f5c518" opacity="0.75"/>
    <circle cx="290" cy="68" r="2" fill="#f5c518" opacity="0.8"/>
    <circle cx="315" cy="58" r="2.5" fill="#f5c518" opacity="0.65"/>
    <circle cx="205" cy="105" r="3.5" fill="#f5c518" opacity="0.85"/>
    <circle cx="235" cy="98" r="2" fill="#f5c518" opacity="0.9"/>
    <circle cx="265" cy="92" r="3" fill="#f5c518" opacity="0.8"/>
    <circle cx="295" cy="88" r="2.5" fill="#f5c518" opacity="0.7"/>
    <circle cx="325" cy="82" r="2" fill="#f5c518" opacity="0.6"/>
    <circle cx="220" cy="125" r="2.5" fill="#f5c518" opacity="0.85"/>
    <circle cx="250" cy="118" r="3" fill="#f5c518" opacity="0.9"/>
    <circle cx="280" cy="110" r="3.5" fill="#f5c518" opacity="0.95"/>
    <circle cx="310" cy="105" r="2" fill="#f5c518" opacity="0.75"/>
    <circle cx="340" cy="98" r="2.5" fill="#f5c518" opacity="0.55"/>
    <circle cx="215" cy="145" r="2" fill="#f5c518" opacity="0.7"/>
    <circle cx="245" cy="138" r="3" fill="#f5c518" opacity="0.8"/>
    <circle cx="275" cy="132" r="2.5" fill="#f5c518" opacity="0.85"/>
    <circle cx="305" cy="125" r="3" fill="#f5c518" opacity="0.7"/>
    <circle cx="230" cy="160" r="2.5" fill="#f5c518" opacity="0.75"/>
    <circle cx="260" cy="155" r="2" fill="#f5c518" opacity="0.8"/>
    <circle cx="290" cy="148" r="3" fill="#f5c518" opacity="0.7"/>
    <circle cx="320" cy="140" r="2" fill="#f5c518" opacity="0.6"/>
    <circle cx="250" cy="175" r="2" fill="#f5c518" opacity="0.6"/>
    <circle cx="280" cy="168" r="2.5" fill="#f5c518" opacity="0.65"/>
    <!-- Outer scattered points -->
    <circle cx="180" cy="70" r="1.5" fill="#f5c518" opacity="0.4"/>
    <circle cx="175" cy="120" r="1.5" fill="#f5c518" opacity="0.35"/>
    <circle cx="190" cy="155" r="1.5" fill="#f5c518" opacity="0.3"/>
    <circle cx="340" cy="65" r="1.5" fill="#f5c518" opacity="0.35"/>
    <circle cx="355" cy="110" r="1.5" fill="#f5c518" opacity="0.3"/>
  </g>

  <!-- === TEAL POINT CLOUD (English / Right) === -->
  <!-- Ambient glow -->
  <ellipse cx="520" cy="110" rx="140" ry="100" fill="url(#tealCloudGlow)"/>

  <!-- Teal dots - scattered cluster -->
  <g filter="url(#tealGlow)">
    <circle cx="460" cy="58" r="2" fill="#3ec9a7" opacity="0.6"/>
    <circle cx="480" cy="48" r="2.5" fill="#3ec9a7" opacity="0.65"/>
    <circle cx="510" cy="55" r="3" fill="#3ec9a7" opacity="0.8"/>
    <circle cx="540" cy="45" r="2.5" fill="#3ec9a7" opacity="0.85"/>
    <circle cx="565" cy="60" r="3.5" fill="#3ec9a7" opacity="0.9"/>
    <circle cx="590" cy="52" r="2" fill="#3ec9a7" opacity="0.7"/>
    <circle cx="470" cy="78" r="2.5" fill="#3ec9a7" opacity="0.7"/>
    <circle cx="500" cy="72" r="3" fill="#3ec9a7" opacity="0.85"/>
    <circle cx="530" cy="68" r="2" fill="#3ec9a7" opacity="0.9"/>
    <circle cx="555" cy="78" r="3.5" fill="#3ec9a7" opacity="0.85"/>
    <circle cx="585" cy="72" r="2.5" fill="#3ec9a7" opacity="0.8"/>
    <circle cx="610" cy="80" r="2" fill="#3ec9a7" opacity="0.6"/>
    <circle cx="475" cy="100" r="3" fill="#3ec9a7" opacity="0.75"/>
    <circle cx="505" cy="95" r="2.5" fill="#3ec9a7" opacity="0.9"/>
    <circle cx="535" cy="90" r="3" fill="#3ec9a7" opacity="0.85"/>
    <circle cx="560" cy="98" r="2" fill="#3ec9a7" opacity="0.9"/>
    <circle cx="590" cy="92" r="3" fill="#3ec9a7" opacity="0.8"/>
    <circle cx="490" cy="118" r="2" fill="#3ec9a7" opacity="0.8"/>
    <circle cx="520" cy="110" r="3.5" fill="#3ec9a7" opacity="0.95"/>
    <circle cx="548" cy="115" r="3" fill="#3ec9a7" opacity="0.85"/>
    <circle cx="575" cy="108" r="2.5" fill="#3ec9a7" opacity="0.9"/>
    <circle cx="600" cy="102" r="2" fill="#3ec9a7" opacity="0.7"/>
    <circle cx="485" cy="138" r="2.5" fill="#3ec9a7" opacity="0.7"/>
    <circle cx="515" cy="132" r="3" fill="#3ec9a7" opacity="0.8"/>
    <circle cx="545" cy="135" r="2" fill="#3ec9a7" opacity="0.85"/>
    <circle cx="570" cy="128" r="2.5" fill="#3ec9a7" opacity="0.75"/>
    <circle cx="595" cy="122" r="2" fill="#3ec9a7" opacity="0.65"/>
    <circle cx="500" cy="155" r="2" fill="#3ec9a7" opacity="0.65"/>
    <circle cx="530" cy="150" r="2.5" fill="#3ec9a7" opacity="0.7"/>
    <circle cx="555" cy="152" r="3" fill="#3ec9a7" opacity="0.6"/>
    <circle cx="520" cy="170" r="2" fill="#3ec9a7" opacity="0.5"/>
    <circle cx="550" cy="168" r="1.5" fill="#3ec9a7" opacity="0.45"/>
    <!-- Outer scattered -->
    <circle cx="445" cy="90" r="1.5" fill="#3ec9a7" opacity="0.35"/>
    <circle cx="625" cy="65" r="1.5" fill="#3ec9a7" opacity="0.35"/>
    <circle cx="620" cy="115" r="1.5" fill="#3ec9a7" opacity="0.3"/>
    <circle cx="580" cy="155" r="1.5" fill="#3ec9a7" opacity="0.3"/>
  </g>

  <!-- === ALIGNMENT LINES (the Procrustes mapping) === -->
  <g opacity="0.35" stroke="url(#alignGrad)" stroke-width="0.8">
    <line x1="270" y1="55" x2="510" y2="55"/>
    <line x1="260" y1="72" x2="500" y2="72"/>
    <line x1="280" y1="110" x2="520" y2="110"/>
    <line x1="265" y1="92" x2="535" y2="90"/>
    <line x1="250" y1="118" x2="505" y2="95"/>
    <line x1="290" y1="68" x2="530" y2="68"/>
    <line x1="305" y1="125" x2="548" y2="115"/>
    <line x1="245" y1="138" x2="515" y2="132"/>
    <line x1="275" y1="132" x2="545" y2="135"/>
    <line x1="230" y1="78" x2="470" y2="78"/>
    <line x1="295" y1="88" x2="555" y2="78"/>
    <line x1="250" y1="175" x2="520" y2="170"/>
  </g>

  <!-- === SUBTLE HIEROGLYPHIC SHAPES === -->

  <!-- Eye of Horus outline (left area, subtle) -->
  <g transform="translate(145, 80) scale(0.55)" opacity="0.12" fill="none" stroke="#f5c518" stroke-width="2" stroke-linecap="round">
    <!-- Outer eye shape -->
    <path d="M0,25 Q25,-5 50,10 Q65,18 70,25 Q65,35 50,42 Q25,55 0,25Z"/>
    <!-- Iris -->
    <circle cx="38" cy="25" r="9" fill="#f5c518" opacity="0.15"/>
    <circle cx="38" cy="25" r="5" fill="#f5c518" opacity="0.25"/>
    <!-- Teardrop line -->
    <path d="M38,42 Q35,60 30,72"/>
    <!-- Spiral tail -->
    <path d="M30,72 Q22,78 28,82 Q35,85 38,78"/>
  </g>

  <!-- Pyramid (center-left, subtle) -->
  <g opacity="0.08" fill="none" stroke="#f5c518" stroke-width="1.5">
    <path d="M370,185 L400,40 L430,185Z"/>
    <!-- Inner structure lines -->
    <line x1="400" y1="40" x2="400" y2="185"/>
    <line x1="385" y1="112" x2="415" y2="112"/>
  </g>

  <!-- Ankh silhouette (right area, subtle) -->
  <g transform="translate(635, 55) scale(0.5)" opacity="0.1" fill="none" stroke="#3ec9a7" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Loop -->
    <ellipse cx="30" cy="22" rx="16" ry="22"/>
    <!-- Vertical bar -->
    <line x1="30" y1="44" x2="30" y2="110"/>
    <!-- Horizontal bar -->
    <line x1="10" y1="65" x2="50" y2="65"/>
  </g>

  <!-- Small scattered hieroglyphic marks (geometric, very subtle) -->
  <g opacity="0.06" stroke="#c4b5fd" stroke-width="1" fill="none">
    <!-- Small reed/feather marks -->
    <path d="M160,170 Q165,155 162,140"/>
    <path d="M650,160 Q655,145 652,130"/>
    <!-- Tiny circle-dot (sun symbol) -->
    <circle cx="170" cy="45" r="6"/>
    <circle cx="170" cy="45" r="1.5" fill="#c4b5fd"/>
  </g>

  <!-- === ROTATION ARC (showing alignment transformation) === -->
  <g opacity="0.15" fill="none" stroke="#c4b5fd" stroke-width="1.2" stroke-dasharray="4,3">
    <!-- Curved arrow suggesting rotation/alignment -->
    <path d="M350,30 Q400,15 450,30"/>
    <!-- Arrowhead -->
    <polygon points="448,26 456,30 448,34" fill="#c4b5fd" stroke="none" opacity="0.2"/>
  </g>

  <!-- Small matrix notation hint (very subtle) -->
  <g opacity="0.07" fill="#c4b5fd" font-family="'Courier New', monospace" font-size="10">
    <text x="380" y="22">W*</text>
  </g>

  <!-- === TEXT: "heiroglyphy" === -->
  <g transform="translate(400, 238)">
    <!-- Subtle text glow -->
    <text x="0" y="0" text-anchor="middle" font-family="'Helvetica Neue', 'Arial', 'Segoe UI', sans-serif" font-size="38" font-weight="300" letter-spacing="3" filter="url(#softGlow)" opacity="0.4">
      <tspan fill="#f5c518">heiro</tspan><tspan fill="#3ec9a7">glyphy</tspan>
    </text>
    <!-- Main text -->
    <text x="0" y="0" text-anchor="middle" font-family="'Helvetica Neue', 'Arial', 'Segoe UI', sans-serif" font-size="38" font-weight="300" letter-spacing="3">
      <tspan fill="#f5c518">heiro</tspan><tspan fill="#3ec9a7">glyphy</tspan>
    </text>
  </g>

  <!-- Subtle tagline -->
  <text x="400" y="262" text-anchor="middle" font-family="'Helvetica Neue', 'Arial', 'Segoe UI', sans-serif" font-size="10" font-weight="300" letter-spacing="4" fill="#c4b5fd" opacity="0.4">
    VECTOR SPACE ALIGNMENT
  </text>

  <!-- Thin decorative line under point clouds -->
  <line x1="160" y1="195" x2="640" y2="195" stroke="url(#alignGrad)" stroke-width="0.5" opacity="0.2"/>

</svg>